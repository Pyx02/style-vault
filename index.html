<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Style Vault</title>
<meta name="description" content="Factory direct premium goods — bags, shoes, watches & apparel.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
<style>
:root {
    --bg: #0a0a0f; --surface: #14141f; --card: #1a1a28; --border: #252538;
    --text: #e8e8f0; --text-muted: #8a8aa0; --accent: #7c5cfc;
    --accent-glow: rgba(124,92,252,0.25); --gold: #d4a853;
    --green: #2ecc71; --red: #e74c3c; --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    -webkit-tap-highlight-color: transparent; user-select: none;
    -webkit-user-select: none; padding-bottom: 20px;
}
.header {
    position: sticky; top:0; z-index:100;
    background: rgba(10,10,15,0.92); backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
    padding: 12px 16px;
}
.header-top { display:flex; align-items:center; justify-content:space-between; }
.logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: var(--gold); }
.search-wrap {
    margin-top: 10px; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0 12px; height: 40px;
}
.search-wrap input {
    flex: 1; background: none; border: none; color: var(--text); font-size: 14px;
    outline: none;
}
.search-wrap input::placeholder { color: var(--text-muted); }
.search-clear { background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-size: 18px; display: none; }
.search-clear.show { display: block; }

/* Categories */
.categories {
    display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none; flex-shrink: 0;
}
.categories::-webkit-scrollbar { display: none; }
.cat-btn {
    flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    font-size: 13px; cursor: pointer; transition: all 0.2s; font-weight: 500;
    white-space: nowrap;
}
.cat-btn:active { transform: scale(0.96); }
.cat-btn.active {
    background: var(--accent); color: white; border-color: var(--accent);
    box-shadow: 0 0 16px var(--accent-glow);
}

/* Banner */
.banner {
    margin: 0 16px 12px; padding: 20px; border-radius: var(--radius);
    background: linear-gradient(135deg, #1a1a30 0%, #0d0d1a 100%);
    border: 1px solid var(--border); text-align: center;
}
.banner h2 { font-size: 18px; margin-bottom: 4px; }
.banner p { color: var(--text-muted); font-size: 13px; }
.banner .gold { color: var(--gold); }

/* Section */
.section-title {
    padding: 0 16px 8px; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
}
.section-count { font-size: 12px; color: var(--text-muted); font-weight: 400; }

/* Product Grid */
.product-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; padding: 0 16px;
}
.product-card {
    background: var(--card); border-radius: var(--radius);
    overflow: hidden; position: relative; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid var(--border);
}
.product-card:active { transform: scale(0.97); }
.card-img-wrap {
    width: 100%;
    overflow: hidden;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}
.card-img-wrap img {
    width: 100%;
    height: auto;
    object-fit: contain;
    display: block;
}
.card-img-placeholder {
    width: 100%;
    height: 160px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
}
.card-tag {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    background: var(--accent); color: white; font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 6px; letter-spacing: 0.5px;
}
.card-tag.hot { background: var(--red); }
.card-tag.best { background: var(--gold); color: #1a1a0a; }
.card-tag.new { background: var(--green); }
.card-yupoo-link {
    position: absolute; top: 8px; right: 8px; z-index: 5;
    background: rgba(0,0,0,0.65); color: white; width: 30px; height: 30px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 14px; text-decoration: none; transition: transform 0.2s;
}
.card-yupoo-link:hover { transform: scale(1.15); }
.card-body { padding: 10px 12px 12px; }
.card-brand {
    font-size: 10px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 2px;
}
.card-name { font-size: 13px; font-weight: 600; margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    line-height: 1.3;
}
.card-bottom { display: flex; align-items: center; justify-content: space-between; }
.card-price { font-size: 14px; font-weight: 700; color: var(--gold); }
.card-retail { font-size: 11px; color: var(--text-muted); text-decoration: line-through; margin-left: 6px; }
.card-wa-btn {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: #25d366; color: white; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
}
.card-wa-btn:active { transform: scale(0.9); }

/* Empty State */
.empty-state { text-align: center; padding: 60px 20px; display: none; }
.empty-state.show { display: block; }
.empty-state-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state h3 { font-size: 16px; margin-bottom: 4px; }
.empty-state p { color: var(--text-muted); font-size: 13px; }

/* Modal */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-sheet {
    background: var(--surface); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto;
    padding: 16px 20px 24px; transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-handle {
    width: 36px; height: 4px; background: var(--border); border-radius: 2px;
    margin: 0 auto 16px;
}
.modal-img-wrap {
    width: 100%; border-radius: var(--radius);
    overflow: hidden; background: var(--card); margin-bottom: 16px;
    display: flex; align-items: center; justify-content: center;
}
/* Image carousel */
.modal-gallery {
    width: 100%; margin-bottom: 16px; position: relative;
}
.modal-gallery-scroll {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    gap: 0; border-radius: var(--radius); background: var(--card);
}
.modal-gallery-scroll::-webkit-scrollbar { display: none; }
.modal-gallery-item {
    flex: 0 0 100%; scroll-snap-align: start; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); min-height: 200px;
}
.modal-gallery-item img {
    width: 100%; height: auto; object-fit: contain; display: block;
}
.modal-gallery-item .placeholder {
    width: 100%; height: 250px; display: flex; align-items: center;
    justify-content: center; font-size: 60px;
}
.modal-gallery-dots {
    display: flex; justify-content: center; gap: 6px; margin-top: 8px;
}
.modal-gallery-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--border);
    transition: background 0.2s; cursor: pointer;
}
.modal-gallery-dot.active { background: var(--accent); }
.modal-gallery-counter {
    position: absolute; top: 8px; right: 8px; z-index: 5;
    background: rgba(0,0,0,0.65); color: white; font-size: 12px;
    padding: 3px 10px; border-radius: 12px;
}
.modal-brand {
    font-size: 11px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 1.5px; margin-bottom: 4px;
}
.modal-name { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.modal-price-row { margin-bottom: 12px; }
.modal-price { font-size: 22px; font-weight: 800; color: var(--gold); }
.modal-retail { font-size: 14px; color: var(--text-muted); text-decoration: line-through; margin-left: 8px; }
.modal-specs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.spec-badge {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; font-size: 11px; color: var(--text-muted);
}
.modal-wa-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px; border-radius: var(--radius); border: none;
    background: #25d366; color: white; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: transform 0.2s; text-decoration: none;
}
.modal-wa-btn:active { transform: scale(0.97); }
.modal-yupoo-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 14px; font-weight: 500;
    cursor: pointer; transition: transform 0.2s; text-decoration: none; margin-top: 8px;
}
.modal-yupoo-btn:active { transform: scale(0.97); }

/* Toast */
.toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 300;
    box-shadow: var(--shadow);
}

/* Footer */
.footer {
    text-align: center; padding: 30px 16px; color: var(--text-muted); font-size: 12px;
}
</style>
</head>

var currentCategory = 'all';
var searchQuery = '';

function filterProducts() {
    var catKey = currentCategory.toLowerCase();
    return products.filter(function(p) {
        var pCat = (p.category || '').toLowerCase();
        if (catKey !== 'all' && pCat !== catKey) return false;
        if (searchQuery) {
            var q = searchQuery.toLowerCase();
            if (p.name.toLowerCase().indexOf(q) === -1 && p.brand.toLowerCase().indexOf(q) === -1) return false;
        }
        return true;
    });
}

function renderProducts() {
    var filtered = filterProducts();
    var grid = document.getElementById('productGrid');
    var empty = document.getElementById('emptyState');
    var count = document.getElementById('sectionCount');
    var title = document.getElementById('sectionTitle');

    var catNames = { all: '🔥 全部', clothing: '👕 服装', bags: '👜 包', shoes: '👟 鞋子', watches: '⌚ 手表' };
    title.textContent = catNames[currentCategory] || 'Products';
    count.textContent = '(' + filtered.length + ' items)';

    if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.add('show');
        return;
    }
    empty.classList.remove('show');

    var html = '';
    for (var i = 0; i < filtered.length; i++) {
        var p = filtered[i];
        var hasImg = p.img && p.img.trim() !== '';
        var imgWrapHtml = '';
        if (hasImg) {
            var innerImg = '<img src="' + p.img + '" alt="' + p.name + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="card-img-placeholder" style="display:none">' + p.emoji + '</div>';
            imgWrapHtml = '<div class="card-img-wrap">' + innerImg + '</div>';
        }
        var tagHtml = p.tag ? '<span class="card-tag ' + (p.tagClass || '') + '">' + p.tag + '</span>' : '';
        var yupooHtml = p.yupoo ? '<a class="card-yupoo-link" href="' + p.yupoo + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="View on Yupoo">📸</a>' : '';
        var priceHtml = p.price > 0
            ? '<div class="card-price">¥' + p.price + '<span class="card-retail">¥' + p.retail + '</span></div>'
            : '<div class="card-price" style="font-size:0.65rem;opacity:0.5">Tap to view</div>';
        var waLink = 'https://wa.me/8617681555093?text=' + encodeURIComponent('Hi Style Vault, I am interested in: ' + p.name);

        html += '<div class="product-card no-img-' + (!hasImg ? 'yes' : 'no') + '" onclick="openProduct(' + p.id + ')">' +
            tagHtml +
            yupooHtml +
            imgWrapHtml +
            '<div class="card-body">' +
                '<div class="card-brand">' + p.brand + '</div>' +
                '<div class="card-name">' + p.name + '</div>' +
                '<div class="card-bottom">' +
                    priceHtml +
                    '<button class="card-wa-btn" onclick="event.stopPropagation();window.open(\'' + waLink + '\',\'_blank\')" title="Order via WhatsApp">💬</button>' +
                '</div>' +
            '</div>' +
        '</div>';
    }
    grid.innerHTML = html;
}

function openProduct(id) {
    var p;
    for (var i = 0; i < products.length; i++) {
        if (products[i].id === id) { p = products[i]; break; }
    }
    if (!p) return;

    // Build gallery images array
    var galleryImgs = [];
    if (p.img && p.img.trim()) {
        galleryImgs.push(p.img);
    }
    // Add gallery images if available
    if (p.gallery && p.gallery.length) {
        for (var gi = 0; gi < p.gallery.length; gi++) {
            if (p.gallery[gi] && p.gallery[gi].trim()) {
                galleryImgs.push(p.gallery[gi]);
            }
        }
    }

    var galleryHtml = '';
    if (galleryImgs.length > 0) {
        galleryHtml = '<div class="modal-gallery">';
        if (galleryImgs.length > 1) {
            galleryHtml += '<div class="modal-gallery-counter" id="galleryCounter">1 / ' + galleryImgs.length + '</div>';
        }
        galleryHtml += '<div class="modal-gallery-scroll" id="galleryScroll">';
        for (var si = 0; si < galleryImgs.length; si++) {
            galleryHtml += '<div class="modal-gallery-item"><img src="' + galleryImgs[si] + '" alt="' + p.name + ' ' + (si+1) + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=placeholder>' + p.emoji + '</div>\'"></div>';
        }
        galleryHtml += '</div>';
        if (galleryImgs.length > 1) {
            galleryHtml += '<div class="modal-gallery-dots" id="galleryDots">';
            for (var di = 0; di < galleryImgs.length; di++) {
                galleryHtml += '<div class="modal-gallery-dot' + (di === 0 ? ' active' : '') + '" data-idx="' + di + '"></div>';
            }
            galleryHtml += '</div>';
        }
        galleryHtml += '</div>';
    } else {
        galleryHtml = '<div class="modal-gallery"><div class="modal-gallery-item"><div class="placeholder">' + p.emoji + '</div></div></div>';
    }

    var specsHtml = '';
    if (p.specs && p.specs.length) {
        specsHtml = '<div class="modal-specs">';
        for (var j = 0; j < p.specs.length; j++) {
            specsHtml += '<span class="spec-badge">' + p.specs[j] + '</span>';
        }
        specsHtml += '</div>';
    }

    var priceHtml = p.price > 0
        ? '<div class="modal-price-row"><span class="modal-price">¥' + p.price + '</span><span class="modal-retail">¥' + p.retail + '</span></div>'
        : '';

    var waLink = 'https://wa.me/8617681555093?text=' + encodeURIComponent('Hi Style Vault, I am interested in: ' + p.name);
    var yupooHtml = p.yupoo ? '<a class="modal-yupoo-btn" href="' + p.yupoo + '" target="_blank" rel="noopener">📸 View Full Album on Yupoo</a>' : '';

    document.getElementById('modalContent').innerHTML =
        galleryHtml +
        '<div class="modal-brand">' + p.brand + '</div>' +
        '<div class="modal-name">' + p.name + '</div>' +
        priceHtml +
        specsHtml +
        '<a class="modal-wa-btn" href="' + waLink + '" target="_blank" rel="noopener">💬 Order via WhatsApp</a>' +
        yupooHtml;

    // Gallery scroll tracking
    if (galleryImgs.length > 1) {
        var scrollEl = document.getElementById('galleryScroll');
        var dots = document.querySelectorAll('.modal-gallery-dot');
        var counter = document.getElementById('galleryCounter');
        scrollEl.addEventListener('scroll', function() {
            var idx = Math.round(scrollEl.scrollLeft / scrollEl.offsetWidth);
            for (var di = 0; di < dots.length; di++) {
                dots[di].classList.toggle('active', di === idx);
            }
            if (counter) counter.textContent = (idx + 1) + ' / ' + galleryImgs.length;
        });
        // Click dot to scroll
        dots.forEach(function(dot, di) {
            dot.addEventListener('click', function() {
                scrollEl.scrollTo({ left: di * scrollEl.offsetWidth, behavior: 'smooth' });
            });
        });
    }

    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
}

// ==================== CATEGORY CLICK ====================
var catBtns = document.querySelectorAll('.cat-btn');
for (var i = 0; i < catBtns.length; i++) {
    (function(btn) {
        btn.addEventListener('click', function() {
            for (var j = 0; j < catBtns.length; j++) {
                catBtns[j].classList.remove('active');
            }
            this.classList.add('active');
            currentCategory = this.getAttribute('data-cat').toLowerCase().trim();
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClear').classList.remove('show');
            searchQuery = '';
            renderProducts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    })(catBtns[i]);
}

// ==================== SEARCH ====================
var searchInput = document.getElementById('searchInput');
var searchClear = document.getElementById('searchClear');
var searchTimer = null;
var composing = false;

searchInput.addEventListener('compositionstart', function() { composing = true; });
searchInput.addEventListener('compositionend', function() {
    composing = false;
    searchQuery = this.value;
    if (searchQuery) { searchClear.classList.add('show'); } else { searchClear.classList.remove('show'); }
    renderProducts();
});
searchInput.addEventListener('input', function() {
    if (composing) return;
    if (searchTimer) clearTimeout(searchTimer);
    var self = this;
    searchTimer = setTimeout(function() {
        searchQuery = self.value;
        if (searchQuery) { searchClear.classList.add('show'); } else { searchClear.classList.remove('show'); }
        renderProducts();
    }, 200);
});

document.getElementById('searchClear').addEventListener('click', function() {
    document.getElementById('searchInput').value = '';
    searchQuery = '';
    this.classList.remove('show');
    renderProducts();
});

// ==================== MODAL ====================
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// ==================== KEYBOARD ====================
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

// ==================== INIT ====================
renderProducts();
</script>
