<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Style Vault</title>
    <meta name="description" content="Premium branded bags, shoes, watches & accessories — factory direct.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #14141f;
            --card: #1a1a28;
            --border: #252538;
            --text: #e8e8f0;
            --text-muted: #8a8aa0;
            --accent: #7c5cfc;
            --accent-glow: rgba(124, 92, 252, 0.25);
            --gold: #d4a853;
            --green: #2ecc71;
            --red: #e74c3c;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            padding-bottom: 20px;
        }

        /* ========== HEADER ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10,10,15,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .logo-accent { color: var(--accent); }

        .header-actions {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }
        .icon-btn:active { transform: scale(0.92); background: var(--card); }

        .cart-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent);
            color: white;
            font-size: 10px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
        }
        .cart-count.show { display: flex; }

        /* ========== SEARCH ========== */
        .search-wrap {
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: all 0.25s;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--text-muted);
            pointer-events: none;
        }
        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            display: none;
            padding: 4px;
            border-radius: 50%;
        }
        .search-clear.show { display: block; }

        /* ========== CATEGORIES ========== */
        .categories {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex-shrink: 0;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            flex-shrink: 0;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .cat-btn:active { transform: scale(0.96); }
        .cat-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        /* ========== BANNER ========== */
        .banner {
            margin: 0 16px 16px;
            background: linear-gradient(135deg, #1a1040, #0d1a30);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .banner::after {
            content: '';
            position: absolute;
            top: -30px;
            right: -20px;
            width: 100px;
            height: 100px;
            background: var(--accent-glow);
            border-radius: 50%;
            filter: blur(40px);
        }
        .banner-badge {
            display: inline-block;
            background: rgba(124,92,252,0.2);
            color: #b4a0ff;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .banner h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }
        .banner p {
            font-size: 13px;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
        }

        /* ========== PRODUCT GRID ========== */
        .section-title {
            font-size: 17px;
            font-weight: 700;
            padding: 0 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-count {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 0 16px;
        }

        .product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .product-card:active { transform: scale(0.97); }
        .card-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: var(--surface);
        }
        .card-img-placeholder {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: linear-gradient(135deg, var(--surface), var(--card));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .card-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--accent);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }
        .card-tag.hot { background: var(--red); }
        .card-tag.best { background: var(--gold); color: #1a1a0a; }
        .card-tag.view { background: #5b6eae; }
        .card-tag.sale { background: #e67e22; }
        .card-tag.luxury { background: var(--gold); color: #1a1a0a; }

        /* Yupoo album quick link on card */
        .card-yupoo-link {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 5;
            background: rgba(0,0,0,0.65);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .card-yupoo-link:hover { transform: scale(1.15); }

        .card-body {
            padding: 10px 12px 12px;
        }
        .card-brand {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .card-name {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }
        .card-price .retail {
            font-size: 11px;
            color: var(--text-muted);
            text-decoration: line-through;
            font-weight: 400;
            margin-left: 6px;
        }
        .card-wa-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #25d366;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .card-wa-btn:active { transform: scale(0.88); }

        /* ========== PRODUCT DETAIL MODAL ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            animation: fadeIn 0.2s;
        }
        .modal-overlay.hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-sheet {
            width: 100%;
            max-width: 480px;
            max-height: 88vh;
            background: var(--surface);
            border-radius: 20px 20px 0 0;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
            margin: 0 auto;
        }
        .modal-handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 12px auto;
        }
        .modal-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: var(--card);
        }
        .modal-img-placeholder {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: linear-gradient(135deg, var(--card), var(--surface));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }
        .modal-content {
            padding: 16px 20px 24px;
        }
        .modal-brand {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }
        .modal-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .modal-price-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 16px;
        }
        .modal-price {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent);
        }
        .modal-retail {
            font-size: 15px;
            color: var(--text-muted);
            text-decoration: line-through;
        }
        .modal-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .modal-specs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .spec-tag {
            padding: 6px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn-wa-order {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }
        .btn-wa-order:active { transform: scale(0.97); opacity: 0.9; }
        .btn-yupoo-album {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: var(--card);
            color: var(--gold);
            border: 1px solid var(--gold);
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        .btn-yupoo-album:hover { background: var(--gold); color: #1a1a0a; }
        .btn-close-modal {
            width: 100%;
            padding: 12px;
            background: var(--card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            cursor: pointer;
        }

        /* ========== CART DRAWER ========== */
        .cart-drawer {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 300;
            display: flex;
            justify-content: flex-end;
            display: none;
        }
        .cart-drawer.open { display: flex; }
        .cart-panel {
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            animation: slideRight 0.3s ease-out;
        }
        @keyframes slideRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .cart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        .cart-header h3 { font-size: 18px; font-weight: 700; }
        .cart-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--card);
            border: none;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .cart-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: var(--card);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            align-items: center;
        }
        .cart-item-img {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            flex-shrink: 0;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
        }
        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cart-item-price { font-size: 14px; font-weight: 700; color: var(--accent); }
        .cart-item-remove {
            background: none;
            border: none;
            color: var(--red);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }
        .cart-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .cart-empty-icon { font-size: 56px; margin-bottom: 12px; }
        .cart-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 600;
        }
        .cart-total-price { color: var(--accent); font-size: 18px; font-weight: 700; }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-state-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; margin-bottom: 6px; }
        .empty-state p { font-size: 14px; color: var(--text-muted); }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            z-index: 500;
            pointer-events: none;
            animation: toastIn 0.3s, toastOut 0.3s 2s forwards;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

        /* ========== FOOTER ========== */
        .footer {
            text-align: center;
            padding: 32px 16px 20px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid var(--border);
            margin-top: 24px;
        }
        .footer a { color: var(--accent); text-decoration: none; }

        /* ========== RESPONSIVE ========== */
        @media (min-width: 640px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
                max-width: 640px;
                margin: 0 auto;
                padding: 0 20px;
            }
            .categories {
                max-width: 640px;
                margin: 0 auto;
                padding: 12px 20px;
            }
            .header {
                padding: 12px 20px;
            }
            .banner {
                max-width: 640px;
                margin: 0 auto 16px;
                left: 0;
                right: 0;
            }
            .section-title {
                max-width: 640px;
                margin: 0 auto 12px;
                padding: 0 20px;
            }
            .modal-sheet { border-radius: 20px; margin-bottom: 20px; }
        }
    </style>
</head>

{"id": 2145, "name": "直喷款3.0", "brand": "直喷款3.0", "category": "clothing", "price": 0, "retail": 0, "img": "images/apparel/直喷款3.0.jpg", "emoji": "👕", "tag": "New", "tagClass": "new", "yupoo": "https://020sale.x.yupoo.com/albums?tab=gallery", "desc": "直喷款3.0 — Premium quality, factory direct. Tap to see full photo album on Yupoo.", "specs": ["1:1 Quality", "Full Packaging", "Brand Box", "Factory Direct"]}];
        // ==================== STATE ====================
        let cart = JSON.parse(localStorage.getItem('nbv_cart') || '[]');
        let currentCategory = 'all';
        let searchQuery = '';

        // ==================== RENDER ====================
        function filterProducts() {
            return products.filter(p => {
                const catMatch = currentCategory === 'all' || p.category === currentCategory;
                const searchMatch = !searchQuery ||
                    p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    p.brand.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    p.category.toLowerCase().includes(searchQuery.toLowerCase());
                return catMatch && searchMatch;
            });
        }

        function renderProducts() {
            const filtered = filterProducts();
            const grid = document.getElementById('productGrid');
            const empty = document.getElementById('emptyState');
            const count = document.getElementById('sectionCount');
            const title = document.getElementById('sectionTitle');

            const catNames = { all: '🔥 全部', shoes: '👟 鞋子', bags: '👜 包', clothing: '👕 服装', watches: '⌚ 手表' };
            title.innerHTML = catNames[currentCategory] || 'Products';
            count.textContent = filtered.length ? `(${filtered.length} items)` : '';

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                count.textContent = '';
            } else {
                empty.classList.add('hidden');
                grid.innerHTML = filtered.map(p => {
                    const img = p.img
                        ? `<img src="${p.img}" alt="${p.name}" class="card-img" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="card-img-placeholder" style="display:none">${p.emoji}</div>`
                        : `<div class="card-img-placeholder" style="font-size:3rem">${p.emoji}</div>`;
                    const tag = p.tag ? `<span class="card-tag ${p.tagClass}">${p.tag}</span>` : '';
                    const yupooBtn = p.yupoo ? `<a class="card-yupoo-link" href="${p.yupoo}" target="_blank" onclick="event.stopPropagation()" title="View photos on Yupoo">📸</a>` : '';
                    const priceDisplay = p.price > 0 
                        ? `<div class="card-price">${CURRENCY}${p.price}<span class="retail">${CURRENCY}${p.retail}</span></div>`
                        : `<div class="card-price" style="font-size:0.7rem;opacity:0.5">Tap to view</div>`;
                    return `
                    <div class="product-card" onclick="openProduct(${p.id})">
                        ${tag}
                        ${yupooBtn}
                        ${img}
                        <div class="card-body">
                            <div class="card-brand">${p.brand}</div>
                            <div class="card-name">${p.name}</div>
                            <div class="card-bottom">
                                ${priceDisplay}
                                <button class="card-wa-btn" onclick="event.stopPropagation();orderViaWA(${p.id})" title="Order via WhatsApp">💬</button>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            }
        }

        // ==================== PRODUCT MODAL ====================
        function openProduct(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;

            const modal = document.getElementById('productModal');
            const imgContainer = document.getElementById('modalImgContainer');
            const content = document.getElementById('modalContent');

            const img = p.img
                ? `<img src="${p.img}" alt="${p.name}" class="modal-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="modal-img-placeholder" style="display:none">${p.emoji}</div>`
                : `<div class="modal-img-placeholder">${p.emoji}</div>`;

            imgContainer.innerHTML = img;
            content.innerHTML = `
                <div class="modal-brand">${p.brand}</div>
                <div class="modal-name">${p.name}</div>
                <div class="modal-price-row">
                    ${p.price > 0 ? `<span class="modal-price">${CURRENCY}${p.price}</span><span class="modal-retail">${CURRENCY}${p.retail}</span>` : '<span class="modal-price" style="opacity:0.5">Contact for price</span>'}
                </div>
                <div class="modal-specs">
                    ${p.specs.map(s => `<span class="spec-tag">${s}</span>`).join('')}
                </div>
                <div class="modal-desc">${p.desc}</div>
                ${p.yupoo ? `<a href="${p.yupoo}" target="_blank" class="btn-yupoo-album">📸 View Full Album on Yupoo →</a>` : ''}
                <button class="btn-wa-order" onclick="orderViaWA(${p.id})">
                    💬 Order via WhatsApp
                </button>
                <button class="btn-close-modal" onclick="closeModal()">Close</button>
            `;

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(e) {
            if (e && e.target !== document.getElementById('productModal')) return;
            document.getElementById('productModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        // ==================== WHATSAPP ORDER ====================
        function orderViaWA(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            const msg = encodeURIComponent(
                `Hi! I'm interested in:\n\n` +
                `${p.brand} — ${p.name}\n` +
                `Price: ${CURRENCY}${p.price}\n\n` +
                `Can you share more details? 😊`
            );
            window.open(`https://wa.me/${WA_NUMBER}?text=${msg}`, '_blank');
        }

        function orderCartViaWA() {
            if (cart.length === 0) return;
            const items = cart.map(c => `• ${c.brand} — ${c.name} (${CURRENCY}${c.price})`).join('\n');
            const total = cart.reduce((sum, c) => sum + c.price, 0);
            const msg = encodeURIComponent(
                `Hi! I'd like to order:\n\n${items}\n\n` +
                `Total: ${CURRENCY}${total}\n\n` +
                `Please confirm availability & shipping. Thanks! 😊`
            );
            window.open(`https://wa.me/${WA_NUMBER}?text=${msg}`, '_blank');
        }

        // ==================== CART ====================
        function addToCart(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            cart.push({ id: p.id, name: p.name, brand: p.brand, price: p.price, emoji: p.emoji });
            saveCart();
            showToast(`Added to bag ✨`);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            renderCart();
            updateCartCount();
        }

        function saveCart() {
            localStorage.setItem('nbv_cart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            const el = document.getElementById('cartCount');
            el.textContent = cart.length;
            if (cart.length > 0) el.classList.add('show');
            else el.classList.remove('show');
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const footer = document.getElementById('cartFooter');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <div class="cart-empty-icon">🛒</div>
                        <p>Your bag is empty</p>
                        <p style="font-size:12px;color:var(--text-muted)">Tap ＋ on any product to add it</p>
                    </div>`;
                footer.innerHTML = '';
            } else {
                container.innerHTML = cart.map((c, i) => `
                    <div class="cart-item">
                        <div class="cart-item-img">${c.emoji}</div>
                        <div class="cart-item-info">
                            <div class="cart-item-name">${c.brand} — ${c.name}</div>
                            <div class="cart-item-price">${CURRENCY}${c.price}</div>
                        </div>
                        <button class="cart-item-remove" onclick="removeFromCart(${i})">🗑️</button>
                    </div>
                `).join('');

                const total = cart.reduce((s, c) => s + c.price, 0);
                footer.innerHTML = `
                    <div class="cart-total">
                        <span>Total (${cart.length} items)</span>
                        <span class="cart-total-price">${CURRENCY}${total}</span>
                    </div>
                    <button class="btn-wa-order" onclick="orderCartViaWA()">
                        💬 Order All via WhatsApp
                    </button>
                `;
            }
        }

        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            const isOpen = drawer.classList.contains('open');
            if (isOpen) {
                drawer.classList.remove('open');
                document.body.style.overflow = '';
            } else {
                renderCart();
                drawer.classList.add('open');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeCartDrawer(e) {
            if (e.target === document.getElementById('cartDrawer')) {
                document.getElementById('cartDrawer').classList.remove('open');
                document.body.style.overflow = '';
            }
        }

        // ==================== SEARCH ====================
        function handleSearch() {
            const input = document.getElementById('searchInput');
            const clear = document.getElementById('searchClear');
            searchQuery = input.value.trim();
            if (searchQuery) clear.classList.add('show');
            else clear.classList.remove('show');
            renderProducts();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClear').classList.remove('show');
            searchQuery = '';
            renderProducts();
        }

        // ==================== CATEGORIES ====================
        document.getElementById('categoryNav').addEventListener('click', (e) => {
            const btn = e.target.closest('.cat-btn');
            if (!btn) return;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = btn.dataset.cat;
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClear').classList.remove('show');
            searchQuery = '';
            renderProducts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ==================== TOAST ====================
        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // ==================== KEYBOARD ====================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                document.getElementById('cartDrawer').classList.remove('open');
                document.body.style.overflow = '';
            }
        });

        // ==================== INIT ====================
        updateCartCount();
        renderProducts();
    </script>
</body>
</html>
