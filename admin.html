<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Vault - 后台管理</title>
<style>
:root{--bg:#0a0a0f;--card:#1a1a28;--surface:#14141f;--border:#252538;--text:#e8e8f0;--muted:#8a8aa0;--accent:#7c5cfc;--green:#2ecc71;--red:#e74c3c;--gold:#d4a853;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* Login */
.login-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:var(--card);padding:40px;border-radius:var(--radius);border:1px solid var(--border);text-align:center;width:320px}
.login-box h2{margin-bottom:8px;font-size:20px}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:20px}
.login-box input{width:100%;padding:12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;text-align:center;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;padding:12px;border-radius:var(--radius);border:none;background:var(--accent);color:white;font-size:15px;font-weight:600;cursor:pointer}
.login-box .error{color:var(--red);font-size:12px;margin-top:8px}
/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface);gap:8px;flex-wrap:wrap}
.topbar h1{font-size:18px;white-space:nowrap}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar select,.toolbar input{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;outline:none}
.toolbar select:focus,.toolbar input:focus{border-color:var(--accent)}
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-accent{background:var(--accent);color:white}
.btn-green{background:var(--green);color:white}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-red{background:var(--red);color:white}
/* Table */
.table-wrap{overflow-x:auto;margin:16px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th{background:var(--surface);font-size:11px;text-transform:uppercase;color:var(--muted);position:sticky;top:0}
tr:hover{background:var(--surface)}
td span.img-preview{color:var(--green);font-size:10px}
td span.no-img{color:var(--muted);font-size:10px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
.modal-box h3{margin-bottom:16px;font-size:16px}
.modal-box label{display:block;margin-bottom:4px;color:var(--muted);font-size:12px;margin-top:10px}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;margin-bottom:8px;outline:none;resize:vertical}
.modal-box textarea{min-height:60px}
.modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:10px 24px;border-radius:20px;font-size:13px;z-index:9999;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>🛍️ Style Vault</h2>
    <p>后台管理系统</p>
    <input type="password" id="pwdInput" placeholder="输入密码" autofocus onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">进入后台</button>
    <div id="loginError" style="color:var(--red);font-size:12px;margin-top:8px;display:none">密码错误</div>
    <p style="margin-top:20px;font-size:11px;color:var(--muted)">默认密码: admin888</p>
  </div>
</div>

<!-- MAIN (hidden until login) -->
<div id="mainPanel" style="display:none">
  <div class="topbar">
    <h1>🛍️ Style Vault 后台</h1>
    <div class="toolbar">
      <select id="filterCat" onchange="renderTable()">
        <option value="all">全部分类</option>
        <option value="clothing">👕 服装</option>
        <option value="bags">👜 包</option>
        <option value="shoes">👟 鞋子</option>
        <option value="watches">⌚ 手表</option>
      </select>
      <input type="text" id="filterSearch" placeholder="搜索..." oninput="renderTable()">
      <button class="btn btn-accent" onclick="openAddModal()">+ 添加</button>
      <button class="btn btn-green" onclick="saveToStore()">💾 保存到商城</button>
      <button class="btn btn-outline" onclick="exportStore()">📦 导出</button>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>品牌</th><th>产品名</th><th>分类</th><th>图片</th><th>价格</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div style="text-align:center;padding:16px;color:var(--muted);font-size:12px">
    共 <strong id="totalCount">0</strong> 个产品
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 id="modalTitle">编辑产品</h3>
    <label>品牌</label><input type="text" id="editBrand">
    <label>产品名</label><input type="text" id="editName">
    <label>分类</label>
    <select id="editCat">
      <option value="clothing">👕 服装</option>
      <option value="bags">👜 包</option>
      <option value="shoes">👟 鞋子</option>
      <option value="watches">⌚ 手表</option>
    </select>
    <label>图片路径</label><input type="text" id="editImg" placeholder="images/apparel/xxx.jpg 或留空">
    <label>Emoji</label><input type="text" id="editEmoji" placeholder="👕">
    <label>Yupoo 链接</label><input type="text" id="editYupoo" placeholder="https://xxx.x.yupoo.com/albums/...">
    <label>价格（0=显示Tap to view）</label><input type="number" id="editPrice" min="0" value="0">
    <label>标签</label><input type="text" id="editTag" placeholder="New">
    <label>描述（简短）</label><textarea id="editDesc" placeholder="Premium quality, factory direct."></textarea>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-accent" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

// ==================== LOAD ====================
(function init() {
    var stored = localStorage.getItem('admin_products');
    if (stored) {
        try { 
            products = JSON.parse(stored);
            console.log('Loaded ' + products.length + ' from localStorage');
        } catch(e) { 
            console.error('localStorage parse error:', e);
            products = EMBEDDED_PRODUCTS;
        }
    }
    if (!products || products.length === 0) {
        products = EMBEDDED_PRODUCTS;
        console.log('Loaded ' + products.length + ' from embedded data');
    }
})();

// ==================== LOGIN ====================
function doLogin() {
    var pwd = document.getElementById('pwdInput').value.trim();
    console.log('Login attempt with password length:', pwd.length);
    if (pwd === ADMIN_PWD) {
        console.log('Login OK');
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'block';
        renderTable();
    } else {
        var err = document.getElementById('loginError');
        err.style.display = 'block';
        setTimeout(function() { err.style.display = 'none'; }, 2000);
    }
}

// ==================== RENDER ====================
function renderTable() {
    var cat = document.getElementById('filterCat').value;
    var search = document.getElementById('filterSearch').value.toLowerCase();
    var filtered = products;
    if (cat !== 'all') {
        filtered = filtered.filter(function(p) { return p.category === cat; });
    }
    if (search) {
        filtered = filtered.filter(function(p) {
            return (p.name||'').toLowerCase().indexOf(search) !== -1 ||
                   (p.brand||'').toLowerCase().indexOf(search) !== -1;
        });
    }
    
    var html = '';
    for (var i = 0; i < filtered.length; i++) {
        var p = filtered[i];
        var hasImg = (p.img && p.img.trim());
        var imgCell = hasImg 
            ? '<span class="img-preview" title="' + p.img + '">✅ 有图</span>'
            : '<span class="no-img">❌ 无图</span>';
        html += '<tr>' +
            '<td>' + p.id + '</td>' +
            '<td>' + (p.brand||'') + '</td>' +
            '<td>' + (p.name||'') + '</td>' +
            '<td>' + p.category + '</td>' +
            '<td>' + imgCell + '</td>' +
            '<td>' + (p.price > 0 ? '¥'+p.price : '询价') + '</td>' +
            '<td>' +
                '<button class="btn btn-outline btn-sm" onclick="openEditModal(' + i + ')">✏️</button> ' +
                '<button class="btn btn-red btn-sm" onclick="deleteProduct(' + i + ')">🗑</button>' +
            '</td>' +
        '</tr>';
    }
    document.getElementById('tableBody').innerHTML = html;
    document.getElementById('totalCount').textContent = filtered.length;
}

// ==================== EDIT ====================
function openEditModal(idx) {
    var p = products[idx];
    if (!p) return;
    editId = idx;
    document.getElementById('modalTitle').textContent = '编辑: ' + p.name;
    document.getElementById('editBrand').value = p.brand || '';
    document.getElementById('editName').value = p.name || '';
    document.getElementById('editCat').value = p.category || 'clothing';
    document.getElementById('editImg').value = p.img || '';
    document.getElementById('editEmoji').value = p.emoji || '👕';
    document.getElementById('editYupoo').value = p.yupoo || '';
    document.getElementById('editPrice').value = p.price || 0;
    document.getElementById('editTag').value = p.tag || '';
    document.getElementById('editDesc').value = p.desc || '';
    document.getElementById('editModal').style.display = 'flex';
}

function openAddModal() {
    editId = null;
    document.getElementById('modalTitle').textContent = '添加新产品';
    document.getElementById('editBrand').value = '';
    document.getElementById('editName').value = '';
    document.getElementById('editCat').value = 'clothing';
    document.getElementById('editImg').value = '';
    document.getElementById('editEmoji').value = '👕';
    document.getElementById('editYupoo').value = '';
    document.getElementById('editPrice').value = '0';
    document.getElementById('editTag').value = '';
    document.getElementById('editDesc').value = 'Premium quality, factory direct.';
    document.getElementById('editModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('editModal').style.display = 'none';
}

function saveEdit() {
    var p = editId !== null ? products[editId] : {};
    var newId = editId !== null ? p.id : Math.max.apply(null, products.map(function(x){return x.id;}).concat([0])) + 1;
    
    var product = {
        id: newId,
        name: document.getElementById('editName').value.trim(),
        brand: document.getElementById('editBrand').value.trim(),
        category: document.getElementById('editCat').value,
        price: parseInt(document.getElementById('editPrice').value) || 0,
        retail: p.retail || 0,
        img: document.getElementById('editImg').value.trim(),
        emoji: document.getElementById('editEmoji').value || '👕',
        tag: document.getElementById('editTag').value || 'New',
        tagClass: p.tagClass || 'new',
        yupoo: document.getElementById('editYupoo').value.trim(),
        desc: document.getElementById('editDesc').value.trim(),
        specs: p.specs || ['1:1 Quality', 'Full Packaging', 'Brand Box', 'Factory Direct']
    };
    
    // Preserve gallery if exists
    if (p.gallery && p.gallery.length) product.gallery = p.gallery;
    
    if (editId !== null) {
        products[editId] = product;
    } else {
        products.push(product);
    }
    
    closeModal();
    renderTable();
    showToast('产品已保存 ✓');
}

function deleteProduct(idx) {
    if (!confirm('确定删除 ' + products[idx].name + '？')) return;
    products.splice(idx, 1);
    renderTable();
    showToast('产品已删除');
}

// ==================== SAVE & EXPORT ====================
function saveToStore() {
    try {
        localStorage.setItem('admin_products', JSON.stringify(products));
        showToast('✅ 已保存到商城 localStorage！刷新商城页面即可看�?');
    } catch(e) {
        showToast('❌ 保存失败: ' + e.message);
    }
}

function exportStore() {
    // Fetch current store HTML
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'index.html?' + Date.now(), true);
    xhr.onload = function() {
        var html = xhr.responseText;
        // Replace products array
        var start = html.indexOf('var products = [');
        if (start < 0) {
            showToast('❌ 无法找到产品数组');
            return;
        }
        var depth = 1, i = start + 17;
        while (i < html.length && depth > 0) {
            if (html[i] === '[') depth++;
            else if (html[i] === ']') depth--;
            i++;
        }
        var newJson = JSON.stringify(products, null, 2);
        var newHtml = html.substring(0, start + 17) + newJson + ';' + html.substring(i + 1);
        
        // Download
        var blob = new Blob([newHtml], {type: 'text/html;charset=utf-8'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'index.html';
        a.click();
        showToast('📦 导出完成！上传到 GitHub 替换即可');
    };
    xhr.onerror = function() {
        // Fallback: export JSON only
        var blob = new Blob([JSON.stringify(products, null, 2)], {type: 'application/json;charset=utf-8'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'products.json';
        a.click();
        showToast('📦 产品数据已导出（无法获取商城HTML）');
    };
    xhr.send();
}

// ==================== TOAST ====================
function showToast(msg) {
    var existing = document.querySelector('.toast');
    if (existing) existing.remove();
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 3000);
}
</script>
