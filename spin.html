<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Style Vault · Lucky Spin</title>
<style>
:root{
  --bg:#0B121C;
  --card:#162133;
  --surface:#1C2940;
  --border:rgba(212,168,83,.15);
  --text:#E4E8F0;
  --muted:#7D8BA3;
  --accent:#D4A853;
  --gold-light:#E8CC7A;
  --green:#25D366;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
a{text-decoration:none}

/* Floating emoji background */
.emoji-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.emoji-bg span{position:absolute;bottom:-40px;animation:floatUp linear infinite;opacity:.12;font-size:22px}
@keyframes floatUp{
  0%{transform:translateY(0) rotate(0deg);opacity:0}
  10%{opacity:.14}
  90%{opacity:.08}
  100%{transform:translateY(-110vh) rotate(360deg);opacity:0}
}

/* Code gate */
.code-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.gate-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px 24px;text-align:center;max-width:360px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.gate-icon{font-size:48px;display:block;margin-bottom:12px}
.gate-title{font-size:20px;font-weight:800;color:var(--accent);margin-bottom:8px}
.gate-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px}
.gate-input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;text-align:center;letter-spacing:1px;font-family:monospace;margin-bottom:8px;outline:none}
.gate-input:focus{border-color:var(--accent)}
.gate-input::placeholder{color:var(--muted);letter-spacing:0;font-family:inherit}
.gate-err{font-size:12px;color:#ef4444;min-height:18px;margin-bottom:12px}
.gate-btn{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--gold-light));color:#0B121C;font-size:15px;font-weight:800;letter-spacing:.5px;box-shadow:0 4px 16px rgba(212,168,83,.25);margin-bottom:16px;transition:all .2s}
.gate-btn:active{transform:scale(.96)}
.gate-hint{font-size:11px;color:var(--muted);line-height:1.5}

/* Main view */
#mainView{display:none;position:relative;z-index:1}
.container{max-width:500px;margin:0 auto;padding:20px 16px 40px;text-align:center}

/* Header */
.header{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.logo .mark{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--gold-light));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#0B121C;font-weight:900}
.subtitle{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:24px;letter-spacing:.5px}

/* Wheel */
.wheel-wrap{position:relative;width:300px;height:300px;margin:0 auto}
.wheel-face{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;z-index:1;box-shadow:0 0 50px rgba(212,168,83,.1), inset 0 0 30px rgba(0,0,0,.4);border:3px solid rgba(212,168,83,.35)}
.wheel-face canvas{width:100%;height:100%;display:block;border-radius:50%}

/* Pointer */
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--accent);filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));z-index:5}

/* Spin button */
.spin-btn{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--gold-light));color:#0B121C;font-size:13px;font-weight:800;letter-spacing:.5px;box-shadow:0 4px 24px rgba(212,168,83,.35), inset 0 1px 0 rgba(255,255,255,.25);transition:all .2s;z-index:3}
.spin-btn:active{transform:scale(.92)}
.spin-btn.done{background:var(--surface);color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.3);pointer-events:none;font-size:11px}

/* Sparkles around wheel */
.sparkles{position:absolute;inset:-20px;pointer-events:none;z-index:0}
.sparkle{position:absolute;width:6px;height:6px;background:var(--accent);border-radius:50%;animation:sparklePulse 1.5s ease-in-out infinite;box-shadow:0 0 8px var(--accent)}
@keyframes sparklePulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.4)}}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(6,10,20,.88);backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:var(--card);width:100%;max-width:500px;border-radius:24px 24px 0 0;border:1px solid var(--border);border-bottom:none;padding:32px 20px 36px;transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);text-align:center;max-height:90vh;overflow:auto;box-shadow:0 -8px 40px rgba(0,0,0,.5)}
.modal-overlay.open .modal{transform:translateY(0)}
.modal .me{font-size:56px;display:block;margin-bottom:12px}
.modal .mn{font-size:20px;font-weight:800;color:var(--accent);margin-bottom:6px}
.modal .md{font-size:13px;color:var(--muted);margin-bottom:4px}
.modal .mt{font-size:13px;color:var(--accent);margin-bottom:20px;font-weight:600}
.btn-claim{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#2DD46B,#1da851);color:#fff;font-size:15px;font-weight:700;margin-bottom:10px;box-shadow:0 4px 16px rgba(37,211,102,.2)}
.btn-claim:active{transform:scale(.97)}
.btn-close{width:100%;padding:12px;border-radius:14px;background:transparent;color:var(--muted);font-size:13px;border:1px solid var(--border)}

/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:101}
.confetti-piece{position:absolute;width:8px;height:8px;top:-10px;animation:fall linear forwards}
@keyframes fall{to{top:110vh;transform:rotate(720deg)}}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);padding:12px 24px;border-radius:30px;font-size:13px;font-weight:600;border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:90;display:none;animation:toastIn .3s ease}
.toast.show{display:block}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media(max-width:360px){
  .wheel-wrap{width:260px;height:260px}
}
</style>
</head>
<body>

<!-- Floating emoji background -->
<div class="emoji-bg" id="emojiBg"></div>

<!-- Code gate -->
<div class="code-gate" id="codeGate">
  <div class="gate-card">
    <span class="gate-icon">🎡</span>
    <div class="gate-title">Lucky Spin Access</div>
    <div class="gate-sub">Enter your redemption code to unlock the wheel.<br>Codes are issued after order confirmation.</div>
    <input class="gate-input" id="codeInput" placeholder="SV-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="gate-err" id="codeErr"></div>
    <button class="gate-btn" onclick="validateCode()">Unlock Wheel 🎰</button>
    <div class="gate-hint">No code yet? Message us on <b>WhatsApp</b> after placing your order and we'll send you one.</div>
  </div>
</div>

<!-- Main view -->
<div id="mainView">
<div class="container">
  <div class="header">
    <div class="logo"><div class="mark">SV</div>Style <span style="color:var(--accent)">Vault</span></div>
  </div>

  <div class="wheel-wrap" id="wheelWrap">
    <div class="sparkles" id="sparklesLayer"></div>
    <div class="wheel-face" id="wheelFace">
      <canvas id="wheelCanvas"></canvas>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="doSpin()">🎰<br>SPIN</button>
    <div class="pointer"></div>
  </div>
</div>
</div>

<!-- Result Modal -->
<div class="modal-overlay" id="resultModal">
  <div class="modal">

    <div class="mn" id="modalName"></div>
    <div class="md" id="modalDesc"></div>
    <div class="mt" id="modalTip"></div>
    <button class="btn-claim" id="claimBtn" onclick="claimPrize()">💬 Claim via WhatsApp</button>
    <button class="btn-close" onclick="closeModal()">Close</button>
  </div>
</div>

<div class="confetti" id="confettiLayer"></div>
<div class="toast" id="toast"></div>

  for(var i=0;i<25;i++){
    var s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100+'%';
    s.style.fontSize = (16+Math.random()*20)+'px';
    s.style.animationDuration = (8+Math.random()*12)+'s';
    s.style.animationDelay = Math.random()*10+'s';
    bg.appendChild(s);
  }
})();

// ============ CODE VALIDATION ============
function normalizeCode(v){
  v = (v||'').trim().toUpperCase();
  return v.replace(/[^A-Z0-9-]/g,'');
}

function validateCode(){
  var input = normalizeCode(document.getElementById('codeInput').value);
  var errEl = document.getElementById('codeErr');
  if(!input){ errEl.textContent = 'Please enter your code'; return; }
  try{
    var list = atob(CODE_B64).split(' ');
    if(list.indexOf(input) !== -1){
      var used = [];
      try{ used = JSON.parse(localStorage.getItem('sv_used_codes')||'[]'); }catch(e){}
      if(used.indexOf(input) !== -1){
        errEl.textContent = 'This code has already been used on this device';
        return;
      }
      used.push(input);
      try{ localStorage.setItem('sv_used_codes',JSON.stringify(used)); }catch(e){}
      try{ sessionStorage.setItem('sv_verified','1'); }catch(e){}
      verified = true;
      unlockWheel();
    }else{
      errEl.textContent = 'Invalid code. Please check and try again.';
    }
  }catch(e){
    errEl.textContent = 'Error validating code. Please try again.';
  }
}

function unlockWheel(){
  document.getElementById('codeGate').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  setTimeout(initWheel, 80); // Wait for reflow
}

// ============ INIT ============
function initWheel(){
  drawWheel();
  renderSparkles();
}

// Check if already verified this session
(function(){
  try{
    if(sessionStorage.getItem('sv_verified')==='1'){
      verified = true;
      unlockWheel();
    }
  }catch(e){}
})();

// ============ SPARKLES ============
function renderSparkles(){
  var wrap = document.getElementById('wheelWrap');
  var size = wrap.offsetWidth || 300;
  var layer = document.getElementById('sparklesLayer');
  layer.innerHTML = '';
  for(var i=0;i<8;i++){
    var angle = (i/8)*2*Math.PI - Math.PI/2;
    var r = size/2 + 12;
    var cx = size/2, cy = size/2;
    var x = cx + r*Math.cos(angle);
    var y = cy + r*Math.sin(angle);
    var dot = document.createElement('div');
    dot.className = 'sparkle';
    dot.style.left = x+'px';
    dot.style.top = y+'px';
    dot.style.animationDelay = (i*0.2)+'s';
    layer.appendChild(dot);
  }
}

// ============ WHEEL DRAWING ============
function drawWheel(){
  var wrap = document.getElementById('wheelWrap');
  var size = wrap.offsetWidth || 300;
  var canvas = document.getElementById('wheelCanvas');
  var dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size+'px';
  canvas.style.height = size+'px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var cx = size/2, cy = size/2, r = size/2-4;
  var seg = 2*Math.PI/PRIZES.length;

  // Colors
  var colors = ['#162133','#1C2940'];

  for(var i=0;i<PRIZES.length;i++){
    var p = PRIZES[i];
    var start = i*seg - Math.PI/2;
    var end = start+seg;

    // Segment
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);
    ctx.closePath();
    ctx.fillStyle = colors[i%2];
    ctx.fill();
    ctx.strokeStyle = 'rgba(212,168,83,.3)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Text
    var mid = start+seg/2;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(mid);
    ctx.textAlign = 'center';

    // Emoji at outer (74% radius)
    ctx.font = '20px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(p.emoji, r*0.74, 6);

    // Short name at inner (50% radius)
    ctx.font = 'bold 11px ' + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = '#E4E8F0';
    ctx.fillText(p.short, r*0.48, 6);

    ctx.restore();
  }
}

// ============ SPIN ============
function doSpin(){
  if(spinning) return;
  spinning = true;
  var btn = document.getElementById('spinBtn');

  // Weighted random selection using actual (hidden) weights
  var total = 0;
  for(var i=0;i<_rw.length;i++) total += _rw[i];
  var rand = Math.random()*total;
  var winner = 0;
  for(var i=0;i<_rw.length;i++){
    rand -= _rw[i];
    if(rand <= 0){ winner = i; break; }
  }

  // Calculate rotation angle
  var seg = 360/PRIZES.length;
  var targetAngle = 360 - (winner*seg + seg/2) - 90;
  targetAngle += (Math.random()-0.5)*seg*0.6;
  var spins = 5 + Math.floor(Math.random()*4);
  var finalAngle = targetAngle + spins*360;

  // Animate wheel
  var face = document.getElementById('wheelFace');
  face.style.transition = 'transform 4.5s cubic-bezier(.12,.6,.1,.97)';
  face.style.transform = 'rotate('+finalAngle+'deg)';

  // Disable button
  btn.textContent = '...';
  btn.style.pointerEvents = 'none';

  // Result
  setTimeout(function(){
    currentPrize = PRIZES[winner];
    btn.innerHTML = '✅<br>DONE';
    btn.classList.add('done');
    btn.style.pointerEvents = 'none';
    spinning = false;
    showResult();
  }, 4700);
}

// ============ RESULT MODAL ============
function showResult(){
  document.getElementById('modalEmoji').textContent = currentPrize.emoji;
  document.getElementById('modalName').textContent = currentPrize.name;
  document.getElementById('modalDesc').textContent = currentPrize.desc;
  document.getElementById('modalTip').textContent = 'Contact us on WhatsApp to claim your prize!';
  document.getElementById('resultModal').classList.add('open');
  launchConfetti();
}

function closeModal(){
  document.getElementById('resultModal').classList.remove('open');
}

function claimPrize(){
  var msg = encodeURIComponent('Hi! I just won '+currentPrize.name+' ('+currentPrize.emoji+') on Style Vault Lucky Spin! How do I claim my prize? 🎉');
  window.open('https://wa.me/8617681555093?text='+msg, '_blank');
}

// ============ CONFETTI ============
function launchConfetti(){
  var colors = ['#D4A853','#E8CC7A','#25D366','#ef4444','#8b5cf6','#60a5fa','#f472b6'];
  var emojis = ['🎉','✨','💛','⭐','💖','🎊','💫'];
  var layer = document.getElementById('confettiLayer');
  layer.innerHTML = '';
  for(var i=0;i<50;i++){
    var el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random()*100+'%';
    el.style.width = (5+Math.random()*8)+'px';
    el.style.height = (5+Math.random()*8)+'px';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.borderRadius = Math.random()>.5?'50%':'2px';
    el.style.animationDuration = (2+Math.random()*3)+'s';
    el.style.animationDelay = Math.random()*.8+'s';
    if(Math.random()>.7){
      el.style.background = 'transparent';
      el.style.width = '16px';
      el.style.height = '16px';
      el.style.fontSize = '14px';
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    }
    layer.appendChild(el);
  }
  setTimeout(function(){ layer.innerHTML = ''; }, 4000);
}

// ============ TOAST ============
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}
</script>
